name: Update SEC data

on:
  schedule:
    - cron: "0 0 1 * *"   # 매월 1일 00:00 UTC (09:00 KST)
    - cron: "0 0 5 * *"   # 매월 5일 00:00 UTC (09:00 KST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/sec_crawler.py

      - name: Build datasets, Excel and dashboard JSON
        run: python scripts/analyze.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data README.md
          if git diff --cached --quiet; then
            echo "No changes in SEC data."
          else
            git commit -m "data: monthly SEC EDGAR update ($(date -u +%Y-%m-%d))"
            git push
          fi
